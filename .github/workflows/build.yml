name: Build KPM Module
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Cross-Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Clone KernelPatch Framework
        run: |
          git clone --depth=1 https://github.com/bmax121/KernelPatch.git

      - name: Compile KPM Module
        run: |
          # সরাসরি aarch64-linux-gnu-gcc দিয়ে কম্পাইল করা হচ্ছে
          # -nostdinc ব্যবহার করা হচ্ছে যাতে সিস্টেমের ডিফল্ট হেডার ইনক্লুড না হয়
          aarch64-linux-gnu-gcc -c -O2 -fno-pic -fno-PIE -fno-stack-protector \
          -fno-asynchronous-unwind-tables -fno-unwind-tables -fno-exceptions \
          -nostdinc \
          -I./KernelPatch/kernel/include \
          -I./KernelPatch/kernel/patch/include \
          -I./KernelPatch/kernel/linux/include \
          -I./KernelPatch/kernel/linux/arch/arm64/include \
          -T./KernelPatch/kpms/demo-hello/hello.lds \
          -o hello.kpm my-kpm.c

      - name: Upload KPM File
        uses: actions/upload-artifact@v4
        with:
          name: Compiled-KPM
          path: hello.kpm
