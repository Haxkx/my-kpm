name: Build KPM Module
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Install Cross-Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          
      - name: Clone KernelPatch and Compile
        run: |
          git clone https://github.com/bmax121/KernelPatch.git
          cp my_kpm.c KernelPatch/kpms/demo-hello/hello.c
          cd KernelPatch/kpms/demo-hello
          make TARGET_COMPILE=aarch64-linux-gnu- ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
          
      - name: Upload KPM File
        uses: actions/upload-artifact@v3
        with:
          name: Compiled-KPM
          path: KernelPatch/kpms/demo-hello/hello.kpm
