name: Build KPM Module
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Cross-Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu make cmake

      - name: Clone KernelPatch Framework
        run: |
          # সাবমডিউলসহ ক্লোন করা হচ্ছে
          git clone --depth=1 https://github.com/bmax121/KernelPatch.git

      - name: Prepare KernelPatch Tools
        run: |
          cd KernelPatch/tools
          # preset.h ফাইলটি জেনারেট করার সঠিক উপায়
          python3 -c "
import os
with open('preset.h', 'w') as f:
    f.write('#ifndef PRESET_H\n')
    f.write('#define PRESET_H\n')
    f.write('#define PRESET_VERSION \"0.0.0\"\n')
    f.write('#define PRESET_KP_VERSION \"0.11.0\"\n')
    f.write('#define EXTRA_ALIGN 8\n')
    f.write('#endif\n')
"
          make

      - name: Compile KPM Module
        run: |
          # আপনার ফাইলটিকে ডেমো ফোল্ডারে কপি করা হচ্ছে
          cp my-kpm.c KernelPatch/kpms/demo-hello/hello.c
          cd KernelPatch/kpms/demo-hello
          
          # APatch-এর নিজস্ব Makefile ব্যবহার করে কম্পাইল করা হচ্ছে
          # TARGET_COMPILE সেট করা হচ্ছে যাতে Makefile বুঝতে পারে
          make TARGET_COMPILE=aarch64-linux-gnu- ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-

      - name: Upload KPM File
        uses: actions/upload-artifact@v4
        with:
          name: Compiled-KPM
          path: KernelPatch/kpms/demo-hello/hello.kpm
