name: Build KPM Module
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Cross-Compiler Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Clone KernelPatch Framework
        run: |
          git clone --depth=1 https://github.com/bmax121/KernelPatch.git

      - name: Build kptools Utility
        run: |
          # preset.h ফাইলটি tools ডিরেক্টরিতে কপি করা হচ্ছে
          cp KernelPatch/kernel/include/preset.h KernelPatch/tools/preset.h
          cd KernelPatch/tools
          make

      - name: Compile KPM Module
        run: |
          # আপনার ফাইলটিকে ডেমো টেমপ্লেটের নামে কপি করা হচ্ছে
          cp my-kpm.c KernelPatch/kpms/demo-hello/hello.c
          cd KernelPatch/kpms/demo-hello

          # TARGET_COMPILE সেট করে বিল্ড করা হচ্ছে
          export TARGET_COMPILE=aarch64-linux-gnu-
          make

          # আউটপুট ফাইলটি চেক করা (সাধারণত hello.kpm তৈরি হয়)
          ls -la *.kpm

      - name: Upload KPM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Compiled-KPM
          path: KernelPatch/kpms/demo-hello/hello.kpm
