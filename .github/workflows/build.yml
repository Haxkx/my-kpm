name: Build KPM Module
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake python3
          
      - name: Clone KernelPatch
        run: |
          git clone https://github.com/bmax121/KernelPatch.git
          
      - name: Build kptools
        run: |
          cd KernelPatch/tools
          
          # ম্যানুয়ালি preset.h তৈরি করা হচ্ছে (EXTRA_ALIGN সহ)
          cat << 'EOF' > preset.h
          #ifndef PRESET_H
          #define PRESET_H
          #define PRESET_VERSION "0.0.0"
          #define PRESET_KP_VERSION "0.11.0"
          #define EXTRA_ALIGN 8
          #endif
          EOF
          
          # এখন tools ফোল্ডার বিল্ড করা হচ্ছে
          make
          
      - name: Compile KPM with kptools
        run: |
          # kptools ব্যবহার করে আপনার ফাইল কম্পাইল করা হচ্ছে
          ./KernelPatch/tools/kptools kpm -i my-kpm.c -o my-kpm.kpm
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Compiled-KPM
          path: my-kpm.kpm
