name: Build KPM Module
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c
          
      - name: Clone KernelPatch
        run: |
          git clone https://github.com/bmax121/KernelPatch.git
          
      - name: Compile KPM
        run: |
          export NDK=${{ steps.setup-ndk.outputs.ndk-path }}
          export TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin
          export CC=$TOOLCHAIN/aarch64-linux-android31-clang
          
          # kpatch.h ফাইলটি খোঁজার জন্য ইনক্লুড পাথ
          INCLUDE_PATH="-I./KernelPatch/kernel/include -I./KernelPatch/kernel/patch/include"
          
          # সরাসরি clang দিয়ে কম্পাইল করা হচ্ছে (Makefile ছাড়া)
          $CC -c -O2 -fno-pic -fno-PIE -fno-stack-protector -fno-asynchronous-unwind-tables -fno-unwind-tables -fno-exceptions -nostdinc -I$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include $INCLUDE_PATH -o my-kpm.o my-kpm.c
          
          # অবজেক্ট ফাইল থেকে কে.পি.এম (KPM) ফাইল তৈরি করা হচ্ছে
          $TOOLCHAIN/llvm-objcopy -O binary my-kpm.o my-kpm.kpm
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Compiled-KPM
          path: my-kpm.kpm
