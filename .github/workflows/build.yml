name: Build KPM Module
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu build-essential
          
      - name: Clone KernelPatch
        run: |
          git clone https://github.com/bmax121/KernelPatch.git
          
      - name: Compile KPM
        run: |
          # এখানে আপনার ফাইলের সঠিক নামটি দিলাম (my-kpm.c)
          cp my-kpm.c KernelPatch/kpms/demo-hello/hello.c
          
          # কম্পাইল করা হচ্ছে
          cd KernelPatch/kpms/demo-hello
          make TARGET_COMPILE=aarch64-linux-gnu- ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Compiled-KPM
          path: KernelPatch/kpms/demo-hello/hello.kpm
