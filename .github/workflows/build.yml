name: Build KPM Module
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake
          
      - name: Clone KernelPatch
        run: |
          git clone https://github.com/bmax121/KernelPatch.git
          
      - name: Build kptools
        run: |
          cd KernelPatch/tools
          # kptools বিল্ড করার জন্য যা যা দরকার
          make
          
      - name: Compile KPM with kptools
        run: |
          # kptools ব্যবহার করে আপনার ফাইল কম্পাইল করা হচ্ছে
          # APatch-এর অফিসিয়াল ডকুমেন্টেশন অনুযায়ী কমান্ড
          ./KernelPatch/tools/kptools kpm -i my-kpm.c -o my-kpm.kpm
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Compiled-KPM
          path: my-kpm.kpm
